# Opt-in template: supply your own app and backend/origin values before deployment.
# Copy to fly.toml locally; blank app and .invalid hosts intentionally need editing.
app = ""
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  API_URL = "https://your-api.example.invalid"
  APP_ORIGIN = "https://your-web.example.invalid"
  PORT = "3000"

[http_service]
  internal_port        = 3000
  force_https          = true
  auto_stop_machines   = "suspend"
  auto_start_machines  = true
  min_machines_running = 1

[[vm]]
  memory   = "512mb"
  cpu_kind = "shared"
  cpus     = 1
