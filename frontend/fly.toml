# Frontend — fly deploy from /frontend
app = "stockanalyzer-web"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  API_URL = "https://stockanalyzer-api.fly.dev"
  APP_ORIGIN = "https://stockanalyzer-web.fly.dev"
  PORT = "3000"

[http_service]
  internal_port        = 3000
  force_https          = true
  auto_stop_machines   = "suspend"
  auto_start_machines  = true
  min_machines_running = 1

[[vm]]
  memory   = "512mb"
  cpu_kind = "shared"
  cpus     = 1
